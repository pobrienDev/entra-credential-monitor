[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entra-credential-monitor"
dynamic = ["version"]
description = "Read-only monitor that finds expiring Entra app secrets, certificates and SAML signing certificates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patrick O'Brien" }]
dependencies = [
    "azure-identity>=1.19,<2",
    "requests>=2.32,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "responses>=0.25,<1",
    "ruff>=0.17,<1",
]

[project.scripts]
credmon = "credmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "credmon.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["azure-function/function_app.py"]

[tool.ruff.lint]
select = ["F", "E", "W", "B", "SIM", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
