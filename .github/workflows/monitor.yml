name: credential-monitor
on:
  schedule:
    - cron: "0 12 * * *"          # daily, 12:00 UTC (GitHub may start it a few minutes late)
  workflow_dispatch: {}            # manual runs from the Actions tab

permissions:
  id-token: write                  # request the OIDC token for azure/login
  contents: read
  issues: write                    # open/close alert issues (Phase 5)

concurrency:
  group: credential-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: monitor           # the federated credential trusts only this environment
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      # No client secret anywhere: GitHub issues a short-lived OIDC token and Entra
      # exchanges it for a Graph token because credmon-reader trusts this repo+environment.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Scan tenant
        id: scan
        continue-on-error: true    # keep going so the summary and artifact are always produced
        run: credmon scan --config config.yaml --out report/

      - name: Publish run summary
        run: cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: credential-report
          path: report/
          retention-days: 30

      - name: Open or close alert issues
        run: credmon notify --report report/credentials.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Fail if credentials need attention
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::credmon found credentials at or above the fail_on level. See the run summary."
          exit 1
